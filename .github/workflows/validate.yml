name: Validate skills
on: [push, pull_request]
permissions:
  contents: read
jobs:
  output-presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r skills/output-presentation/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-noto-cjk
      - run: python -m unittest discover -s skills/output-presentation/evals -v
  computer-use:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r skills/computer-use/evals/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s skills/computer-use/evals -v
