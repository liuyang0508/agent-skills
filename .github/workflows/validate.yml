name: Validate skills
on: [push, pull_request]
permissions:
  contents: read
jobs:
  output-presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r skills/output-presentation/requirements.txt
      - run: python -m unittest discover -s skills/output-presentation/evals -v
