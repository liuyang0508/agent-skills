<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title"><title id="title">Computer Use：观察、操作、核验</title><rect width="1280" height="720" fill="#f7fafc"/><text x="74" y="89" fill="#1768ed" font-family="sans-serif" font-size="17" letter-spacing="3">COMPUTER USE</text><text x="74" y="212" fill="#18304d" font-family="sans-serif" font-size="68">看准目标，</text><text x="74" y="311" fill="#1768ed" font-family="sans-serif" font-size="68">再做操作。</text><text x="78" y="411" fill="#8199b6" font-family="sans-serif" font-size="22">在授权范围内自主推进，</text><text x="78" y="450" fill="#8199b6" font-family="sans-serif" font-size="22">回读真正保存的结果。</text><rect x="648" y="161" width="543" height="363" rx="20" fill="white" stroke="#d8e5f7"/><path d="M648 215H1191" stroke="#d8e5f7"/><text x="674" y="193" fill="#8199b6" font-family="monospace" font-size="12">WORKSPACE / DRAFT</text><rect x="699" y="256" width="438" height="105" rx="12" fill="#f6faff" stroke="#8eb9f8"/><text x="728" y="299" fill="#4a74a6" font-family="sans-serif" font-size="22">已核对保存结果，</text><text x="728" y="334" fill="#4a74a6" font-family="sans-serif" font-size="22">等待负责人确认。</text><rect x="701" y="400" width="132" height="45" rx="9" fill="#1768ed"/><text x="725" y="429" fill="white" font-family="sans-serif" font-size="16">保存草稿</text><text x="78" y="632" fill="#7191ba" font-family="monospace" font-size="14">OBSERVE → ACT → VERIFY</text></svg>
