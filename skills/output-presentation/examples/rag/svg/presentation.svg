<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 577" width="1200" role="img" aria-labelledby="title"><title id="title">RAG 如何把资料带进回答</title><desc>RAG 先检索相关资料，再结合资料生成回答。检索结果仍需要核验。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#6999dd"/></marker></defs><style>text{font-family:system-ui,sans-serif}.diagram-node{cursor:default}.diagram-node:hover rect,.diagram-node:focus rect{stroke:#1768ed;stroke-width:3}</style><rect width="1200" height="577" fill="white"/><text x="60" y="54" font-size="25" fill="#182d49">RAG 如何把资料带进回答</text><g transform="translate(0,100)" data-block="flow"><g class="diagram-edge" data-edge-id="e1"><path d="M 270 103.0 C 310 103.0, 300 103.0, 340 103.0" stroke="#6999dd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="305.0" y="91.0" text-anchor="middle" font-size="12" fill="#5d7595">发起检索</text><title>发起检索</title></g><g class="diagram-edge" data-edge-id="e2"><path d="M 560 103.0 C 600 103.0, 590 103.0, 630 103.0" stroke="#6999dd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="595.0" y="91.0" text-anchor="middle" font-size="12" fill="#5d7595">取得片段</text><title>取得片段</title></g><g class="diagram-edge" data-edge-id="e3"><path d="M 850 103.0 C 890 103.0, 880 103.0, 920 103.0" stroke="#6999dd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="885.0" y="91.0" text-anchor="middle" font-size="12" fill="#5d7595">提供上下文</text><title>提供上下文</title></g><g class="diagram-edge" data-edge-id="e4"><path d="M 1030.0 146 C 1030.0 191, 160.0 181, 160.0 226" stroke="#6999dd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="595.0" y="174.0" text-anchor="middle" font-size="12" fill="#5d7595">生成回答</text><title>生成回答</title></g><g class="diagram-edge" data-edge-id="e5"><path d="M 160.0 60 C 160.0 12, 1030.0 12, 1030.0 60" stroke="#6999dd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="595.0" y="20" text-anchor="middle" font-size="12" fill="#5d7595">提供问题</text><title>提供问题</title></g><g class="diagram-node" role="group" aria-label="用户问题" data-block-id="flow" data-node-id="question"><title>用户问题</title><rect x="50" y="60" width="220" height="86" rx="14" fill="#f1f6ff" stroke="#9fc4ff"/><text text-anchor="middle" font-size="17" fill="#183b70"><tspan x="160.0" y="91">用户问题</tspan></text></g><g class="diagram-node" role="group" aria-label="检索器" data-block-id="flow" data-node-id="retriever"><title>检索器</title><rect x="340" y="60" width="220" height="86" rx="14" fill="#f1f6ff" stroke="#9fc4ff"/><text text-anchor="middle" font-size="17" fill="#183b70"><tspan x="450.0" y="91">检索器</tspan></text></g><g class="diagram-node" role="group" aria-label="相关资料" data-block-id="flow" data-node-id="passages"><title>相关资料</title><rect x="630" y="60" width="220" height="86" rx="14" fill="#f1f6ff" stroke="#9fc4ff"/><text text-anchor="middle" font-size="17" fill="#183b70"><tspan x="740.0" y="91">相关资料</tspan></text></g><g class="diagram-node" role="group" aria-label="生成模型" data-block-id="flow" data-node-id="generator"><title>生成模型</title><rect x="920" y="60" width="220" height="86" rx="14" fill="#f1f6ff" stroke="#9fc4ff"/><text text-anchor="middle" font-size="17" fill="#183b70"><tspan x="1030.0" y="91">生成模型</tspan></text></g><g class="diagram-node" role="group" aria-label="待核验回答" data-block-id="flow" data-node-id="answer"><title>待核验回答</title><rect x="50" y="226" width="220" height="86" rx="14" fill="#f1f6ff" stroke="#9fc4ff"/><text text-anchor="middle" font-size="17" fill="#183b70"><tspan x="160.0" y="257">待核验回答</tspan></text></g></g><text x="60" y="547" font-size="12" fill="#8b9cb0">图形与标签来自本次结果；完整原始值、来源和限制见随附说明页。</text></svg>