<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 411" width="1200" role="img" aria-labelledby="title"><title id="title">Codex-Harness：工具调用怎样执行？</title><desc>模型提出工具调用。Harness 分派工具并处理执行。工具输出写回会话，供后续模型请求继续使用。执行状态与任务完成需要分别核验。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#6999dd"/></marker></defs><style>text{font-family:system-ui,sans-serif}.diagram-node{cursor:default}.diagram-node:hover rect,.diagram-node:focus rect{stroke:#1768ed;stroke-width:3}</style><rect width="1200" height="411" fill="white"/><text x="60" y="54" font-size="25" fill="#182d49">Codex-Harness：工具调用怎样执行？</text><g transform="translate(0,100)" data-block="flow"><g class="diagram-edge" data-edge-id="e1"><path d="M 270 103.0 C 310 103.0, 300 103.0, 340 103.0" stroke="#6999dd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="305.0" y="91.0" text-anchor="middle" font-size="12" fill="#5d7595">发起调用</text><title>发起调用</title></g><g class="diagram-edge" data-edge-id="e2"><path d="M 560 103.0 C 600 103.0, 590 103.0, 630 103.0" stroke="#6999dd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="595.0" y="91.0" text-anchor="middle" font-size="12" fill="#5d7595">交给实现</text><title>交给实现</title></g><g class="diagram-edge" data-edge-id="e3"><path d="M 850 103.0 C 890 103.0, 880 103.0, 920 103.0" stroke="#6999dd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="885.0" y="91.0" text-anchor="middle" font-size="12" fill="#5d7595">记录输出</text><title>记录输出</title></g><g class="diagram-node" role="group" aria-label="模型调用" data-block-id="flow" data-node-id="model"><title>模型调用</title><rect x="50" y="60" width="220" height="86" rx="14" fill="#f1f6ff" stroke="#9fc4ff"/><text text-anchor="middle" font-size="17" fill="#183b70"><tspan x="160.0" y="91">模型调用</tspan></text></g><g class="diagram-node" role="group" aria-label="工具分派" data-block-id="flow" data-node-id="router"><title>工具分派</title><rect x="340" y="60" width="220" height="86" rx="14" fill="#f1f6ff" stroke="#9fc4ff"/><text text-anchor="middle" font-size="17" fill="#183b70"><tspan x="450.0" y="91">工具分派</tspan></text></g><g class="diagram-node" role="group" aria-label="执行与检查" data-block-id="flow" data-node-id="executor"><title>执行与检查</title><rect x="630" y="60" width="220" height="86" rx="14" fill="#f1f6ff" stroke="#9fc4ff"/><text text-anchor="middle" font-size="17" fill="#183b70"><tspan x="740.0" y="91">执行与检查</tspan></text></g><g class="diagram-node" role="group" aria-label="结果回流" data-block-id="flow" data-node-id="context"><title>结果回流</title><rect x="920" y="60" width="220" height="86" rx="14" fill="#f1f6ff" stroke="#9fc4ff"/><text text-anchor="middle" font-size="17" fill="#183b70"><tspan x="1030.0" y="91">结果回流</tspan></text></g></g><text x="60" y="381" font-size="12" fill="#8b9cb0">图形与标签来自本次结果；完整原始值、来源和限制见随附说明页。</text></svg>